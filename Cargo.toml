[package]
name = "nsx"
edition = "2024"
description = "LangDrift FinOps and Microruntimes CLI"
license = "Apache-2.0"
homepage = "https://langdrift.md"
repository = "https://github.com/jonatassales/nsx"
rust-version = "1.99"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
jiff = "0.2.42"
pulldown-cmark = "0.13.6"
reqwest = { version = "0.13.5", features = ["json"] }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "signal", "fs", "io-util", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
jsonschema = "0.61.1"
pretty_assertions = "1.4.1"
rstest = "0.28.0"
# The tests keep a JSON object's keys in the order they were written, so
# that a schema printed from the types reads in declaration order.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"

[profile.release]
strip = true
