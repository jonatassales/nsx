# Validates main after every merge, then builds nsx for each platform with a
# signed build provenance attestation. Building is not releasing: the binaries
# stay a workflow artifact until the owner decides on a release.
name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  nsx:
    name: nsx ${{ matrix.os }}-${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      # The OIDC token signs the attestation, which is then stored on GitHub.
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: darwin
            arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - os: darwin
            arch: amd64
            runner: macos-15
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain comes from rust-toolchain.toml.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          BINARY: nsx-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          cargo build --release --locked --target "$TARGET"
          mkdir -p dist
          cp "target/$TARGET/release/nsx" "dist/$BINARY"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/nsx-${{ matrix.os }}-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nsx-${{ matrix.os }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
