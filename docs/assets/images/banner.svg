<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="banner-title banner-description">
	<title id="banner-title">nsx, the LangDrift CLI</title>
	<desc id="banner-description">The nsx wordmark beside a terminal that plays the plan and the run of a bounded execution: the team's bound and budget, the suggested model, the gate opened, the spend observed and the pull request ready for review.</desc>
	<defs>
		<linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#8C3BEF"/>
			<stop offset="100%" stop-color="#A970FF"/>
		</linearGradient>
		<radialGradient id="glow" cx="18%" cy="38%" r="60%">
			<stop offset="0%" stop-color="#6D0AD6" stop-opacity="0.32"/>
			<stop offset="100%" stop-color="#6D0AD6" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="drift" x1="0%" y1="0%" x2="100%" y2="0%">
			<stop offset="0%" stop-color="#8C3BEF" stop-opacity="0"/>
			<stop offset="35%" stop-color="#8C3BEF" stop-opacity="0.55"/>
			<stop offset="100%" stop-color="#A970FF" stop-opacity="0.05"/>
		</linearGradient>
		<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
			<circle cx="1.5" cy="1.5" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
		</pattern>
		<clipPath id="frame">
			<rect width="1280" height="640" rx="20"/>
		</clipPath>
		<style>
			.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
			.sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
			.line { font-size: 14.5px; white-space: pre; }
			.comment { fill: #7C7C8A; }
			.output { fill: #E6E6EA; }
			.success { fill: #4ADE80; }
			.warning { fill: #FBBF24; }
			.prompt { fill: #A970FF; }
			.cursor { animation: blink 1.2s steps(1) infinite; }
			@keyframes blink { 50% { opacity: 0; } }
		</style>
	</defs>

	<g clip-path="url(#frame)">
		<rect width="1280" height="640" fill="#0A0A0D"/>
		<rect width="1280" height="640" fill="url(#dots)"/>
		<rect width="1280" height="640" fill="url(#glow)"/>

		<!-- The drift: a line that moves, kept inside the bound. -->
		<path d="M -20 560 C 140 540, 220 470, 330 480 S 520 560, 660 540 S 980 500, 1300 548" fill="none" stroke="url(#drift)" stroke-width="3"/>

		<!-- The wordmark. -->
		<text x="66" y="150" class="sans" font-size="15" font-weight="600" letter-spacing="4" fill="#A970FF">LANGDRIFT CLI</text>
		<text x="60" y="300" class="mono" font-size="150" font-weight="700" fill="url(#brand)" textLength="270" lengthAdjust="spacingAndGlyphs">nsx</text>
		<rect class="cursor" x="346" y="196" width="56" height="108" rx="4" fill="url(#brand)"/>
		<text x="66" y="364" class="sans" font-size="26" font-weight="600" fill="#F4F4F6">A bounded execution</text>
		<text x="66" y="398" class="sans" font-size="26" font-weight="600" fill="#F4F4F6">around your software.</text>

		<g class="sans" font-size="14" font-weight="600" fill="#C9C9D1">
			<rect x="66" y="426" width="82" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
			<text x="107" y="446" text-anchor="middle">FinOps</text>
			<rect x="158" y="426" width="88" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
			<text x="202" y="446" text-anchor="middle">LLMOps</text>
			<rect x="256" y="426" width="134" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
			<text x="323" y="446" text-anchor="middle">Microruntimes</text>
		</g>

		<!-- The envelope: the bound the team sets around the run. -->
		<rect x="470" y="50" width="776" height="480" rx="22" fill="none" stroke="#8C3BEF" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 8"/>

		<!-- The terminal. -->
		<rect x="484" y="64" width="748" height="452" rx="12" fill="#121218" stroke="#2A2A33"/>
		<path d="M 484 100 H 1232" stroke="#2A2A33"/>
		<circle cx="508" cy="82" r="6" fill="#FF5F57"/>
		<circle cx="528" cy="82" r="6" fill="#FEBC2E"/>
		<circle cx="548" cy="82" r="6" fill="#28C840"/>
		<text x="858" y="87" class="mono" font-size="13" text-anchor="middle" fill="#7C7C8A">book-a-demo</text>

		<g class="mono line" xml:space="preserve">
			<text x="508" y="130"><tspan class="prompt">$</tspan><tspan class="output"> nsx agent plan 0031-TICKET-book-a-demo-runtime</tspan></text>
			<text x="508" y="154" class="comment"># plan only · nothing is built, started or paid for in this step</text>
			<text x="508" y="178" class="output">bounded    cpuMillis 2000 · memoryMiB 3072 · set by the team in the design doc</text>
			<text x="508" y="202" class="output">budget     $25.00 per run for model calls · set by the team in the design doc</text>
			<text x="508" y="226" class="success">✓ suggests   claude-sonnet-5-5 · effort medium</text>
			<text x="508" y="250" class="warning">limits     gpu and disk are not runtime.md fields · none requested</text>
			<text x="508" y="274" class="success">✓ plan       runtime.md draft, revision 1 · proposed to the console</text>
			<text x="508" y="322"><tspan class="prompt">$</tspan><tspan class="output"> nsx agent run</tspan></text>
			<text x="508" y="346" class="output">console › estimate   $9.50 · 3.5M input · 250K output · list prices · FIN-02</text>
			<text x="508" y="370" class="success">console › gate       reserved $11.40 of $25.00 · opened</text>
			<text x="508" y="394" class="success">✓ completed  implementation · $9.80 observed of $11.40 reserved · usage record</text>
			<text x="508" y="418" class="success">✓ Safe Seat  met</text>
			<text x="508" y="442" class="success">✓ ready      #19 for review · $1.60 released to the envelope</text>
			<text x="508" y="466" class="comment"># next: the owner reviews #19 and decides whether to merge</text>
			<rect class="cursor" x="508" y="480" width="9" height="17" fill="#E6E6EA"/>
		</g>

		<!-- The path of a run, and the harness that keeps this repository. -->
		<g class="mono" font-size="15">
			<text x="66" y="594"><tspan fill="#F4F4F6">plan</tspan><tspan fill="#A970FF">  →  </tspan><tspan fill="#F4F4F6">authorize</tspan><tspan fill="#A970FF">  →  </tspan><tspan fill="#F4F4F6">run</tspan><tspan fill="#A970FF">  →  </tspan><tspan fill="#F4F4F6">evidence</tspan></text>
			<path d="M 1082 578 l 9 -4 l 9 4 v 8 c 0 6 -4 10 -9 12 c -5 -2 -9 -6 -9 -12 z" fill="none" stroke="#A970FF" stroke-width="1.5"/>
			<text x="1110" y="594" fill="#9A9AA6">guarded by <tspan fill="#F4F4F6" font-weight="700">vtec</tspan></text>
		</g>
	</g>
</svg>
